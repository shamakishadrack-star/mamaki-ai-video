<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MAMAKI AI VIDEO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #172554,
          #020617 55%
        );
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 8px;
    }

    .card {
      background: rgba(15, 23, 42, .92);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 20px;
      box-shadow:
        0 20px 60px rgba(0,0,0,.35);
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea,
    select,
    input[type="file"] {
      width: 100%;
      border: 1px solid #475569;
      background: #020617;
      color: white;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
      );
      color: white;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #020617;
      border: 1px solid #334155;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .video-box {
      margin-top: 20px;
      display: none;
    }

    video {
      width: 100%;
      border-radius: 15px;
      background: black;
    }

    .download {
      display: block;
      text-align: center;
      margin-top: 12px;
      padding: 13px;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      font-weight: 800;
    }

    .small {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
      }

      body {
        padding: 12px;
      }

      .card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      ✨ MAMAKI AI VIDEO
    </div>

    <div class="subtitle">
      Turn your imagination into video
    </div>
  </div>

  <div class="card">

    <label for="prompt">
      Video Prompt
    </label>

    <textarea
      id="prompt"
      placeholder="Example: A cinematic drone shot flying over Lagos at sunset, realistic ocean waves, beautiful golden lighting..."
    ></textarea>

    <div class="row">

      <div>
        <label for="duration">
          Duration
        </label>

        <select id="duration">
          <option value="5">5 seconds</option>
          <option value="10">10 seconds</option>
          <option value="15">15 seconds</option>
          <option value="20">20 seconds</option>
          <option value="30">30 seconds</option>
          <option value="60">60 seconds</option>
        </select>
      </div>

      <div>
        <label for="ratio">
          Format
        </label>

        <select id="ratio">
          <option value="16:9">
            16:9 YouTube
          </option>

          <option value="9:16">
            9:16 TikTok / Reels
          </option>

          <option value="1:1">
            1:1 Social
          </option>
        </select>
      </div>

    </div>

    <label for="referenceImage">
      Optional Reference Image
    </label>

    <input
      id="referenceImage"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    >

    <div class="small">
      Leave the image empty for Text-to-Video.
      Add an image for Image-to-Video.
    </div>

    <button
      id="generateButton"
      onclick="generateVideo()"
    >
      ✨ GENERATE VIDEO
    </button>

    <div
      id="status"
      class="status"
    >
      Ready.
    </div>

    <div
      id="videoBox"
      class="video-box"
    >

      <video
        id="video"
        controls
        playsinline
      ></video>

      <a
        id="download"
        class="download"
        href="#"
        target="_blank"
        download
      >
        ⬇️ Download Video
      </a>

    </div>

  </div>

</div>

<script>

async function generateVideo() {

  const button =
    document.getElementById(
      "generateButton"
    );

  const status =
    document.getElementById(
      "status"
    );

  const videoBox =
    document.getElementById(
      "videoBox"
    );

  const video =
    document.getElementById(
      "video"
    );

  const download =
    document.getElementById(
      "download"
    );

  const prompt =
    document.getElementById(
      "prompt"
    ).value.trim();

  const duration =
    document.getElementById(
      "duration"
    ).value;

  const ratio =
    document.getElementById(
      "ratio"
    ).value;

  const image =
    document.getElementById(
      "referenceImage"
    ).files[0];

  if (!prompt) {
    status.textContent =
      "❌ Please enter a video prompt.";

    return;
  }

  const form =
    new FormData();

  form.append(
    "prompt",
    prompt
  );

  form.append(
    "duration",
    duration
  );

  form.append(
    "ratio",
    ratio
  );

  if (image) {
    form.append(
      "referenceImage",
      image
    );
  }

  button.disabled = true;

  button.textContent =
    "⏳ GENERATING...";

  status.textContent =
    "MAMAKI is generating your video...\n\nPlease wait. The first generation may take some time.";

  videoBox.style.display =
    "none";

  try {

    const response =
      await fetch(
        "/api/generate",
        {
          method: "POST",
          body: form
        }
      );

    const contentType =
      response.headers.get(
        "content-type"
      ) || "";

    /*
     * This prevents the huge Render HTML
     * error page from appearing to the user.
     */

    if (
      !contentType.includes(
        "application/json"
      )
    ) {

      const text =
        await response.text();

      throw new Error(
        "Server did not return JSON. HTTP " +
        response.status +
        ". Render may still be deploying or the service is unavailable."
      );
    }

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Video generation failed."
      );
    }

    const videoUrl =
      data.videoUrl;

    if (!videoUrl) {
      throw new Error(
        "Server generated a response but did not provide a video URL."
      );
    }

    /*
     * Convert relative URL into absolute URL.
     */

    const absoluteUrl =
      new URL(
        videoUrl,
        window.location.origin
      ).href;

    video.src =
      absoluteUrl;

    download.href =
      absoluteUrl;

    videoBox.style.display =
      "block";

    status.textContent =
      "✅ MAMAKI video generated successfully!";

    video.load();

  } catch (error) {

    console.error(
      "MAMAKI FRONTEND ERROR:",
      error
    );

    status.textContent =
      "❌ Generation failed\n\n" +
      error.message;

  } finally {

    button.disabled = false;

    button.textContent =
      "✨ GENERATE VIDEO";
  }
}

/*
=========================================================
CHECK SERVER
=========================================================
*/

async function checkServer() {

  const status =
    document.getElementById(
      "status"
    );

  try {

    const response =
      await fetch(
        "/api/status"
      );

    const data =
      await response.json();

    if (data.ok) {

      status.textContent =
        "🟢 MAMAKI server online.\n" +
        "Replicate: " +
        (data.replicate
          ? "Connected"
          : "Missing token") +
        "\nFFmpeg: " +
        (data.ffmpeg
          ? "Available"
          : "Missing");
    }

  } catch {

    status.textContent =
      "🟠 MAMAKI is loading...";
  }
}

checkServer();

</script>

</body>
</html>
